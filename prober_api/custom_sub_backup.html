                allOpt.value = 'ALL';

                    const cname = countryNames[z.toLowerCase()] || z.toUpperCase();

                    select.value = 'us';

                loadZone();
                
                document.getElementById('localSubLink').innerText = window.location.origin + '/api/local_sub';

                return;

        function startPolling() {
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressText').style.display = 'block';
            
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch('/api/custom_sub/progress?t=' + new Date().getTime());
                    const data = await res.json();
                    
                    const pct = data.total > 0 ? (data.scanned / data.total * 100).toFixed(2) : 0;
                    document.getElementById('progressBar').style.width = pct + '%';
                    document.getElementById('progressText').innerText = `进度: ${data.scanned} / ${data.total} (${pct}%)`;
                    
                    document.getElementById('results').value = data.results.join('\n');
                    document.getElementById('foundCount').innerText = `已发�? ${data.results.length} IP`;
                    
                    if (!data.is_running && data.total > 0) {
                        clearInterval(pollInterval);
                        document.getElementById('scanBtn').disabled = false;
                        document.getElementById('scanBtn').innerText = '🚀 开始深度寻�?;
                        document.getElementById('progressText').innerText += " (扫描完成)";
                    }
                } catch(e) {
                    console.error(e);
                }
            }, 3000);
        }
        
        async function createCron() {
            const country = document.getElementById('countrySelect').value;
            const res = await fetch('/api/custom_sub/cron', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({country: country, cron: '0 0 * * 0'})
            });
            
            if (res.ok) {
                showToast('已创建定时任务：0 0 * * 0 (每周日执�?');
            } else {
                showToast('创建失败');
            }
        }
        
        // Start by checking if a scan is already running
        fetch('/api/custom_sub/progress').then(res => res.json()).then(data => {
            if (data.is_running) {
                document.getElementById('scanBtn').disabled = true;
                document.getElementById('scanBtn').innerText = '扫描�?..';
                startPolling();
            }
        });
        
        loadZones();
    </script>
</body>
</html>
